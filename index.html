<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>BSTRM · DNS3 listening samples</title><link rel="stylesheet" href="style.css"><script defer src="samples.js"></script><script defer src="listen.js"></script></head>
<body><header><div class="wrap header"><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>BSTRM</div><span class="header-detail">DNS3 Extension Set</span></div></header>
<main class="wrap"><h1>Speech enhancement samples</h1><p class="intro">Listen to the same utterance across models. Switch tracks during playback to compare them at the same instant.</p>
<nav id="groups" aria-label="Comparison group"></nav>
<div class="samplebar"><div class="sample-picker"><label for="sample">Sample</label><button id="prev" aria-label="Previous sample">‹</button><select id="sample"></select><button id="next" aria-label="Next sample">›</button></div><span id="source"></span></div>
<section class="transport" aria-label="Playback controls"><button id="play" aria-label="Play" disabled>▶</button><div class="now"><small>Selected track</small><strong id="trackname"></strong></div><span id="clock">0:00</span><input id="seek" type="range" min="0" max="10" step="0.01" value="0" aria-label="Playback position in seconds"><span class="duration">0:10</span><label class="loop"><input id="loop" type="checkbox"> Loop</label></section><div id="error" role="alert"></div>
<div class="legend"><span>Magnitude relative to clean speech</span><span class="db">−80 <b></b> 0 dB</span></div><div id="tracks"></div>
<footer id="method"></footer></main><audio id="audio" preload="metadata"></audio></body></html>
